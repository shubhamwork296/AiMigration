<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Migration Agent</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
    <main class="shell">
        <section class="workspace">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Local Web Runner</p>
                    <h1>AI Migration Agent</h1>
                </div>
                <div id="connectionStatus" class="status-pill">Connecting</div>
            </header>

            <section class="panel">
                <form id="migrationForm" class="migration-form">
                    <div class="mode-toggle field-wide" role="group" aria-label="Migration type">
                        <button id="standardModeButton" class="mode-option active" type="button" data-mode="standard">Framework Upgrade</button>
                        <button id="legacyModeButton" class="mode-option" type="button" data-mode="legacy">Legacy Migration</button>
                    </div>

                    <div class="field field-wide">
                        <label for="sourcePath">Source folder</label>
                        <div class="browse-row">
                            <input id="sourcePath" name="sourcePath" type="text" autocomplete="off">
                            <button class="secondary" type="button" data-browse="sourcePath">Browse</button>
                        </div>
                    </div>

                    <div class="field field-wide">
                        <label for="outputPath">Output folder</label>
                        <div class="browse-row">
                            <input id="outputPath" name="outputPath" type="text" autocomplete="off">
                            <button class="secondary" type="button" data-browse="outputPath">Browse</button>
                        </div>
                    </div>

                    <div class="field field-wide legacy-only">
                        <label for="targetArchitecturePath">Target architecture folder</label>
                        <div class="browse-row">
                            <input id="targetArchitecturePath" name="targetArchitecturePath" type="text" autocomplete="off">
                            <button class="secondary" type="button" data-browse="targetArchitecturePath">Browse</button>
                        </div>
                    </div>

                    <div class="field field-wide legacy-only">
                        <label for="migrationContextPath">Context file</label>
                        <div class="browse-row">
                            <input id="migrationContextPath" name="migrationContextPath" type="text" autocomplete="off">
                            <button class="secondary" type="button" data-browse-file="migrationContextPath">Browse</button>
                        </div>
                    </div>

                    <div class="field">
                        <label for="currentTechnology">Current technology</label>
                        <input id="currentTechnology" name="currentTechnology" list="technologyOptions" type="text" autocomplete="off">
                    </div>

                    <div class="field">
                        <label for="targetTechnology">Target technology</label>
                        <input id="targetTechnology" name="targetTechnology" list="technologyOptions" type="text" autocomplete="off">
                    </div>

                    <div class="field">
                        <label for="currentVersion">Current version</label>
                        <input id="currentVersion" name="currentVersion" list="versionOptions" type="text" autocomplete="off">
                    </div>

                    <div class="field">
                        <label for="targetVersion">Target version</label>
                        <input id="targetVersion" name="targetVersion" list="versionOptions" type="text" autocomplete="off">
                    </div>

                    <datalist id="versionOptions">
                        <option value="6"></option>
                        <option value="8"></option>
                        <option value="14"></option>
                        <option value="15"></option>
                        <option value="16"></option>
                        <option value="17"></option>
                        <option value="18"></option>
                        <option value="19"></option>
                        <option value="20"></option>
                        <option value="21"></option>
                    </datalist>

                    <datalist id="technologyOptions">
                        <option value="Angular"></option>
                        <option value="DotNet"></option>
                        <option value="legacy-webforms"></option>
                        <option value="blazor-ssr"></option>
                    </datalist>

                    <div class="actions">
                        <button id="startButton" type="submit">Start Migration</button>
                        <button id="cancelButton" class="danger" type="button" disabled>Cancel</button>
                    </div>
                </form>
            </section>

            <section class="terminal-wrap">
                <div class="terminal-header">
                    <span>Live Console</span>
                    <button id="clearButton" class="ghost" type="button">Clear</button>
                </div>
                <pre id="terminal" class="terminal"></pre>
            </section>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
