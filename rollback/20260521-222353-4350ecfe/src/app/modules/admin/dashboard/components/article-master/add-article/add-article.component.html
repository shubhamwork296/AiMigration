<div class="clearfix"></div>
<div class="profile_wrp">
   <div class="login_form">
      <form [formGroup]="AddArticleForm" (ngSubmit)="onSubmit()">
         <div class="form-group">
            <label>Article Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control login_fild" placeholder="Article Name" formControlName="articleName" inputRef [appInputMaxLength]="150">
         </div>
         <div *ngIf="(f.articleName.touched || submitted) && f.articleName.errors?.required"
            class="text-danger validation-error">
               {{AppConstants.ATRICLE_NAME_REQIURED}}
         </div>
         <div class="form-group">
            <label>Select Status <span class="text-danger">*</span></label>
            <select class="form-control login_fild" formControlName="isActive">
               <option selected value="">Select Status</option>
               <option value="1">{{AppConstants.STATUS_ACTIVE}}</option>
               <option value="0">{{AppConstants.STATUS_INACTIVE}}</option>
            </select>

         </div>
         <div *ngIf="(f.isActive.touched || submitted) && f.isActive.errors?.required"
            class="text-danger validation-error">
            {{AppConstants.ARTICLE_STATUS_REQUIRED}}
         </div>
         <div class="form-group">
            <label>About Article <span class="text-danger">*</span></label>
            <textarea class="form-control login_fild" placeholder="About Article"
               formControlName="articleDescription" inputRef [appInputMaxLength]="250"></textarea>

         </div>
         <div *ngIf="(f.articleDescription.touched || submitted) && f.articleDescription.errors?.required"
            class="text-danger validation-error">
            {{AppConstants.ABOUT_ARTICLE_REQUIRED}} 
         </div>

         <div class="add_prd_btn_rw">
            <button type="submit" class="btn btn-default login_btn"><em class="fas fa-sign-in-alt"></em>
               <span *ngIf="id; else add">Update</span>
               <ng-template #add>
                  {{AppConstants.SUBMIT}}
               </ng-template>
            </button>
            <button type="button" class="btn btn-default login_btn cancel_btn_frm" (click)="cancel()"><i
                  class="fa fa-times" aria-hidden="true"></i>Cancel</button>
         </div>

      </form>
   </div>
   <div class="clearfix"></div>
</div>
