<h2 mat-dialog-title class="login-signin-title">Renew Smartcard</h2>
<span class="dialog-close" mat-dialog-close><img src="assets/images/Close.svg" alt=""></span>

<mat-dialog-content>

      <div class="shadow-none text-center">
       <p> Are you sure you want to renew the season?</p>
        <button class="default-btn-outline mr-20" mat-button mat-dialog-close (click)="dialogRef.close(false)" >Cancel</button>
    <button mat-button class="default-btn" [mat-dialog-close]="true" (click)="dialogRef.close(true)">Confirm</button>
      </div>
      
</mat-dialog-content>
<mat-dialog-actions align="end" class="mb-10">
    
</mat-dialog-actions>
