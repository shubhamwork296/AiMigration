<app-enhanced-basic-dialog [dialogFooter]="dialogFooter" class=" enhanced-alert-dialogs" [dialogTitle]="headerTitle" role="dialog" aria-modal="true" tabindex="-1">
  <ng-content>
    <div class="enhanced-common-popup-theme">
      <div class="enhanced-common-popup-theme-border">
        <div class="alert-content text-center payment-not-completed-content" role="alert" aria-live="assertive" aria-atomic="true">
          <span class="sr-only">{{ headerTitle }}</span>
          <p>{{ data?.Message }}</p>
        </div>
      </div>
    </div>
  </ng-content>

  <ng-template #dialogFooter>
    <div class="common-popup-theme-footer d-flex footer-buttons-end">
      <button mat-dialog-close type="button" mat-button class="fill-btn logout-popup-btn fill-light-hover-btn payment-not-completed-ok-btn">
          OK
      </button>
    </div>
  </ng-template>
</app-enhanced-basic-dialog>
