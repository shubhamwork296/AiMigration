<app-enhanced-basic-dialog [dialogFooter]="dialogFooter" class="enhanced-alert-dialogs" [dialogTitle]="headerTitle" role="dialog" aria-modal="true" tabindex="-1">
  <ng-content>
    <div class="enhanced-common-popup-theme">
      <div class="enhanced-common-popup-theme-border">
        <div class="enhanced-common-info-content" role="alert" aria-live="assertive" aria-atomic="true">
          <span class="sr-only">{{ headerTitle }}</span>
            <p *ngIf="data?.isDeleteAddress">{{notificationErrorMsg?.deleteAddressConfirmationMessage}}</p>
            <p *ngIf="data?.isDeleteCard">{{notificationErrorMsg?.deleteCardConfirmationMessage}}</p>
        </div>
      </div>
    </div>
  </ng-content>
  <ng-template #dialogFooter>
    <div class="common-popup-theme-footer">
      <div class="two-btn-footer common-popup-footer-fill-btn">
        <button mat-dialog-close type="button" mat-button class="outline-btn outline-primary-btn-hover">
          Cancel
        </button>
        <button *ngIf="data?.isDeleteAddress" mat-dialog-close type="button" mat-button class="season-review-basket-btn fill-btn fill-light-hover-btn " (click)="dialogRef.close(true)">
            Delete address
        </button>
        <button *ngIf="data?.isDeleteCard" mat-dialog-close type="button" mat-button class="season-review-basket-btn fill-btn fill-light-hover-btn" (click)="dialogRef.close(true)">
            Delete card
        </button>
      </div>
    </div>
  </ng-template>
</app-enhanced-basic-dialog>
