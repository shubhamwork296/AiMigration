<app-enhanced-basic-dialog [dialogFooter]="dialogFooter" class=" enhanced-alert-dialogs" [dialogTitle]="headerTitle" role="dialog" aria-modal="true" tabindex="-1">
  <ng-content>
    <div class="enhanced-common-popup-theme">
      <div class="enhanced-common-popup-theme-border">
        <div class="alert-content text-center" role="alert" aria-live="assertive" aria-atomic="true">
          <span class="sr-only">{{ headerTitle }}</span>
          <p>{{ data.Message }}</p>
        </div>
      </div>
    </div>
  </ng-content>

  <ng-template #dialogFooter>
    <div class="common-popup-theme-footer d-flex footer-buttons-end">
      <button mat-dialog-close id="efc-qtt-footer-next-btn" type="button" (click)="onLogout(false)" mat-button class="outline-btn logout-popup-btn outline-primary-btn-hover">
        No
      </button>
      <button mat-dialog-close id="efc-qtt-footer-next-btn" type="button" (click)="onLogout(true)" mat-button class="fill-btn logout-popup-btn fill-light-hover-btn">
        Yes
      </button>
    </div>
  </ng-template>
</app-enhanced-basic-dialog>
