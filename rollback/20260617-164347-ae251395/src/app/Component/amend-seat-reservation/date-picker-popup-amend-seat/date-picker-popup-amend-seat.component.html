<h2 mat-dialog-title class="login-signin-title border-bottom-0 mb-0" *ngIf="isReturnJourney">Return</h2>
<h2 mat-dialog-title class="login-signin-title border-bottom-0 mb-0" *ngIf="!isReturnJourney">Departure</h2>
<span class="dialog-close text-spark cursor-pointer-hover" (click)="onclose()"><img src="assets/images/close-orange.svg"
        alt="">Close</span>

<mat-dialog-content class="fare-heading-list-box ticket-dialog-box">
                <form [formGroup]="dateTimeForm" class="p-relative">
                <ngb-datepicker #dp [displayMonths]="2" [minDate]="ngbMinDate" [maxDate]="ngbMaxDate" [markDisabled]="isDisabled" (click)="onSelectDate(model)"
                [(ngModel)]="model"  [ngModelOptions]="{standalone: true}" (navigate)="date = $event.next">
                </ngb-datepicker>
                <div class="row mt-3">
                    <div class="col-lg-8">
                        <label class="f-12 l-h-5 lbl-tgl-grp-dprt-after">&nbsp;</label>
                        <mat-button-toggle-group formControlName="travelType">
                            <mat-button-toggle value="DEPARTAFTER">Depart After</mat-button-toggle>
                            <mat-button-toggle value="ARRIVEBY">Arrive By</mat-button-toggle>
                        </mat-button-toggle-group>
                    </div>
                    <div class="col-lg-4">
                        <mat-form-field class="one-three-3 w-100 d-block" floatLabel="never">
                            <label class="f-12">Time</label>
                            <mat-form-field class="d-block example-full-width default-input default-input-brdr"
                                floatLabel="never">
                                <mat-select class="border-gray f-16" formControlName="travelTime">
                                    <mat-option *ngFor="let time of tempTimeList" [value]="time">{{time}}</mat-option>
                                </mat-select>
                            </mat-form-field>
                        </mat-form-field>
                    </div>
                </div>
                <div class=" mt-0 mt-md-0">
                    <button mat-button class="default-btn w-m-100 w-100 mt-0 mt-m-10" (click)="applyChanges()">Apply</button>
                </div>
            </form>

</mat-dialog-content>
