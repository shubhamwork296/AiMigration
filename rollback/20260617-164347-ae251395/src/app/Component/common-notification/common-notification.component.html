<app-basic-dialog [dialogTitle]="headerTitle" [dialogFooter]="dialogFooter" [commonDisplayedIcon]="data.displayedIconImage">
    <div class="common-popup-theme-in">
        <div class="common-popup-theme-border">
            <div *ngIf="!data?.isViewBooking" class="common-popup-theme-middle common-popup-theme-fare-middle common-popup-theme-why-middle">
                <p class="m-0 f-16 lh-22 font-400 popup-p-sapce text-justify" [innerHTML]="data.message">
                </p>
            </div>
            <div *ngIf="data?.isViewBooking"
                class="common-popup-theme-middle common-popup-theme-fare-middle common-popup-theme-why-middle">
                <div class="forgot-password-sucess">
                    <p class="f-14 font-dark lh-20 m-f-14">
                        Please do remember the following bike loading guidelines
                    </p>
                    <ul class="m-0 bike-reser-popup-list">
                        <li class="f-14 lh-20 font-dark mb-12">
                            Arrive at the platform at least <span class="font-700">10 minutes before the train
                                departs.</span>
                        </li>
                        <li class="f-14 lh-20 font-dark">
                            <span class="font-700">Show your bike reservation to a staff member</span>
                            who'll help you find where best to stand.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</app-basic-dialog>
<ng-template #dialogFooter>
    <div class="common-popup-theme-footer">
        <button class="new-default-btn w-xs-100" *ngIf="!data.isReviewBuy && !data.isVerifyEmail" mat-dialog-close mat-button>Okay</button>
        <button class="new-default-btn w-xs-100" (click)="isUserVerificationEmail()" *ngIf="data.isVerifyEmail" mat-button>Verify email</button>
        <button *ngIf="data.isReviewBuy && data.isDeliveryModesAvailable" mat-dialog-close mat-button
            class="new-default-outline-btn w-xs-100 mr-24 mb-xs-16 mr-0-mobile">
            Cancel
        </button>
        <button class="new-default-btn w-xs-100 mt-16-mobile" *ngIf="data.isReviewBuy && data.isDeliveryModesAvailable" mat-button (click)="goToSearchResult()">Continue</button>
        <button class="new-default-btn w-xs-100 mt-10-mobile" *ngIf="data.isReviewBuy && !data.isDeliveryModesAvailable && data.isDeliveryAddedForJourney" mat-dialog-close mat-button>Back to search</button>
        <button class="new-default-btn w-xs-100" *ngIf="data.isReviewBuy && !data.isDeliveryAddedForJourney" mat-dialog-close mat-button>Okay</button>
    </div>
</ng-template>
