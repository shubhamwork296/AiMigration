<app-enhanced-basic-dialog [dialogFooter]="dialogFooter" class="enhanced-alert-dialogs content-center" [dialogTitle]="headerTitle" role="dialog" aria-modal="true" tabindex="-1">
  <ng-content>
    <div class="enhanced-common-popup-theme">
      <div class="enhanced-common-popup-theme-border">
        <div class="enhanced-common-info-content" role="alert" aria-live="assertive" aria-atomic="true">
          <span class="sr-only">{{ headerTitle }}</span>
          <div class="icon-wrapper" *ngIf="!data?.bikeNotAvailable">
            <img src="assets/images/new-design-img/no-seats-available.svg" alt="" aria-hidden="true" />
          </div>
          <p>
            {{message}}
          </p>
        </div>
      </div>
    </div>
  </ng-content>
  <ng-template #dialogFooter>
    <div class="common-popup-theme-footer">
      <div class="two-btn-footer">
        <button type="button" mat-button class="outline-btn outline-primary-btn-hover" (click)="backToSerch()">
          Back to search
        </button>
        <button *ngIf="data?.bikeNotAvailable" mat-dialog-close type="button" mat-button class="fill-btn fill-light-hover-btn">
          OK
        </button>
        <button *ngIf="!data?.bikeNotAvailable" (click)="onSelectAnotherTicket()" type="button" mat-button class="fill-btn fill-light-hover-btn">
          Select another ticket
        </button>
      </div>
    </div>
  </ng-template>
</app-enhanced-basic-dialog>
