    <div>
     <div class="delete-heade">   
        <h2 mat-dialog-title class="login-signin-title f-32imp" *ngIf="!isMyProfilePopUp">{{confirmTitle != 'Remove this journey?' ? 'Confirm' : confirmTitle }}</h2>
        <h2 mat-dialog-title class="f-22 lh-27 font-600 link-tag delete-popup-title" *ngIf="isMyProfilePopUp">{{confirmTitle}}</h2>
        <button role="button" aria-label="close button" class="dialog-close b-none p0 dialog-close-focus upgrade-confirm-close-btn" mat-dialog-close><img src="assets/images/Close.svg" alt="" *ngIf="confirmTitle != 'Remove this journey?'"></button>
</div>
        <mat-dialog-content class="upgrade-confirm-content">
            <div class="shadow-none font-weight-500 f-16imp" *ngIf="!isMyProfilePopUp">{{confirmMessage}}</div>
            <div class="shadow-none f-14 lh-20 font-dark mobile-pb-14" *ngIf="isMyProfilePopUp">{{confirmMessage}}</div>
        </mat-dialog-content>
        <mat-dialog-actions class="bt-1 button-h" *ngIf="confirmTitle != 'Remove this journey?'">
            <button class="new-default-outline-btn mr-16" mat-button mat-dialog-close (click)="dialogRef.close(false)">Cancel</button>
            <button mat-button class="new-default-btn ms-0" [mat-dialog-close]="true" (click)="dialogRef.close(true)">Confirm</button>
        </mat-dialog-actions>
        <mat-dialog-actions class="bt-0" *ngIf="confirmTitle == 'Remove this journey?'">
            <button class="simple-btn text-spark-dark me-3 text-underline" mat-button mat-dialog-close (click)="dialogRef.close(false)">Cancel</button>
            <button mat-button class="default-btn plr-60 upgrade-remove-journey-btn" [mat-dialog-close]="true" (click)="dialogRef.close(true)">Remove Journey</button>
        </mat-dialog-actions>
    </div>
</div>
