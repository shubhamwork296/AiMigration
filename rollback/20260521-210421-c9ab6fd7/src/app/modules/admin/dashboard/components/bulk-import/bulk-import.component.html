<div class="clearfix"></div>
    <div class="login_form">
    <div class="bulk_import_wrp_n">
        <div class="add_prd_btn_rw">
            <a  href="javascript:voide(0);" (click)="importExecl()" class="btn btn-default login_btn download_btn_smp"><em class="fas fa-cloud-download-alt"></em>
                Download Sample File
            </a>
        </div>
        <div class="clearfix"></div>
    </div>
    <div class="bulk_import_wrp_n">
        <form>
            <div class="add_product_left">
                <!-- Header -->
 
                <div class="upload__box " draggable="true"  appDrag (files)="filesDropped($event)">
                    <div class="upload__btn-box">
                        <label class="upload__btn">
                            <p class="upload_icon"><em class="fas fa-cloud-upload-alt"></em></p>
                            <p>Upload File <span class="text-danger">*</span></p>
                            <input type="file" multiple (change)="onFileChange($event)" #fileInput
                                class="upload__inputfile" accept=".xls,.xlsx">
                            <span class="cust-upload-txt cust-upload-txt2" *ngIf="excelName==''"><span>Choose a
                                    file</span> or drag it
                                here</span>
                            <span class="cust-upload-txt cust-upload-txt2"
                                *ngIf="excelName!=''"><span>{{excelName}}</span></span>
                            <p class="upload-area__paragraph mb-0">
                               Excel sheet should be in .xlsx/.xls format
                            </p>
                        </label>

                    </div>
                </div>

            </div>
            <div class="add_prd_btn_rw">
                <button (click)="onSubmit()" [disabled]="!payload.length || disablesubmit" mat-button type="submit" class="btn btn-default login_btn"><em class="fas fa-sign-in-alt" ></em>
                    {{AppConstants.SUBMIT}}
                </button>
            </div>
        </form>
        <div class="clearfix"></div>
    </div>
    </div>
<div class="clearfix"></div>
